ServerName localhost
ServerTokens Prod
ServerSignature Off
Timeout 180
<VirtualHost *:${PORT}>
    DocumentRoot /var/www/html/public
    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>
    ErrorLog /proc/self/fd/2
    # Avoid logging query strings, which may contain sensitive input.
    CustomLog /proc/self/fd/1 "%a %m %U %>s %b"
</VirtualHost>
